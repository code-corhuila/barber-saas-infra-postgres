name: Secrets

# The env files with real values (env/dev.env, env/qa.env, env/main.env) are ignored, and the
# examples only name the variables. Each developer's own credentials — the Firebase service account
# of FCM_SERVICE_ACCOUNT_JSON included — never reach this repository, not even forced past
# .gitignore with `git add -f`: a pull request that carries one fails here.

on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No env files, Firebase files or keys
        run: |
          bad=$(git ls-files | grep -iE '^env/[^/]+\.env$|(^|/)\.env$|(^|/)(google-services\.json|GoogleService-Info\.plist)$|firebase-adminsdk.*\.json$|\.(pem|key|jks|keystore|p12)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::These files must never be committed (Annex J J.5.1, secrets policy):"; echo "$bad"; exit 1
          fi
          if git grep -lE '"private_key"|BEGIN (RSA |EC )?PRIVATE KEY' -- . ':!.github/workflows'; then
            echo "::error::A private key is committed"; exit 1
          fi
      - name: The examples hold names, never values
        run: |
          if grep -nE '^(FCM_SERVICE_ACCOUNT_JSON|[A-Z_]*(PASSWORD|TOKEN|PRIVATE_KEY|SECRET))=[^[:space:]]' env/*.example; then
            echo "::error::An env example carries a value: leave it empty"; exit 1
          fi
